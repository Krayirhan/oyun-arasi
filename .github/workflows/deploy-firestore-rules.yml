name: Deploy Firestore rules

# firestore.rules main dalına geldiğinde önce kural testleri (Firestore emülatörü) ve oyun mantığı testleri
# çalışır; hepsi geçerse kurallar Firebase Rules API ile yayımlanır. API kuralları ayrıca derler; hatalı bir
# kural dosyası yayımlanmaz ve iş kırmızı olur. Pull request'lerde yalnızca testler çalışır.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - tests/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-firestore-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - tests/**
      - games/**/logic*.js
      - games/**/*.test.mjs
      - package.json
      - package-lock.json
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules
  cancel-in-progress: false

env:
  PROJECT_ID: oyun-arasi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install test dependencies
        run: npm ci --no-audit --no-fund

      - name: Rules and game logic tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check service account secret
        id: secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning title=Firestore kuralları yayımlanmadı::FIREBASE_SERVICE_ACCOUNT secret'ı yok. Kurulum için FIREBASE_SETUP.md dosyasına bak."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.secret.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        if: steps.secret.outputs.ready == 'true'
        uses: google-github-actions/setup-gcloud@v2

      # Kural seti oluşturulur (derleme hatası varsa burada durur), sonra Firestore'un yayını bu sete çevrilir.
      - name: Deploy rules
        if: steps.secret.outputs.ready == 'true'
        run: |
          set -euo pipefail
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          api="https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID"
          call() {
            local method=$1 url=$2 body=$3 out status
            out=$(mktemp)
            status=$(curl -sS -o "$out" -w '%{http_code}' -X "$method" "$url" \
              -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$body")
            if [ "$status" -ge 300 ]; then
              echo "::error title=Firebase Rules API $status::$(jq -r '.error.message // .' "$out")" >&2
              cat "$out" >&2
              exit 1
            fi
            cat "$out"
          }
          ruleset=$(jq -n --rawfile rules firestore.rules '{source: {files: [{name: "firestore.rules", content: $rules}]}}')
          name=$(call POST "$api/rulesets" "$ruleset" | jq -r '.name')
          echo "Kural seti oluşturuldu: $name"
          release=$(jq -n --arg name "projects/$PROJECT_ID/releases/cloud.firestore" --arg ruleset "$name" '{release: {name: $name, rulesetName: $ruleset}}')
          call PATCH "$api/releases/cloud.firestore" "$release" | jq -r '"Yayında: \(.rulesetName)"'
